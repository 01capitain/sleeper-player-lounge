<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Players Lounge — Travis Kelce</title>
<style>
/* ==========================================================================
   Players Lounge — reaction render template
   1080 x 1920 master canvas (9:16). Dark theme. No network assets:
   system font stack only, no CDN, no remote images.
   Shared by lounge.html (render target) and preview.html (design demo).
   ========================================================================== */

:root {
  /* --- palette: "ink plum" base, amber accent ------------------------- */
  --bg:            #12101a;
  --bg-glow-a:     rgba(139, 124, 255, 0.14);
  --bg-glow-b:     rgba(255, 182, 72, 0.08);
  --surface:       #1b1624;
  --surface-hi:    #241e2f;
  --bubble:        #251f31;
  --bubble-edge:   rgba(255, 255, 255, 0.065);
  --card:          #1e1828;
  --card-edge:     rgba(255, 182, 72, 0.28);

  --text:          #f4f1f8;
  --text-soft:     #c8c0d6;
  --text-dim:      #948aa6;
  --text-faint:    rgba(244, 241, 248, 0.34);

  --accent:        #ffb648;
  --accent-soft:   rgba(255, 182, 72, 0.14);
  --violet:        #8b7cff;

  --hairline:      rgba(255, 255, 255, 0.07);

  /* --- type scale (at the 1080px master width) ------------------------ */
  --fs-title:      48px;
  --fs-sub:        26px;
  --fs-name:       31px;
  --fs-body:       36px;   /* never below 30px — must survive downscaling */
  --fs-chip:       23px;
  --fs-eyebrow:    26px;
  --fs-card:       42px;
  --fs-mark:       25px;

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #0b0910;
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ==========================================================================
   Stage — the exact 1080x1920 master canvas
   ========================================================================== */

#stage {
  position: relative;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(1200px 900px at 82% -8%,  var(--bg-glow-a), transparent 62%),
    radial-gradient(1000px 780px at 8% 104%, var(--bg-glow-b), transparent 60%),
    var(--bg);
  isolation: isolate;
}

/* ==========================================================================
   Header
   ========================================================================== */

.lounge-header {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 26px;
  padding: 54px 48px 34px;
  background: linear-gradient(180deg, rgba(27, 22, 36, 0.96), rgba(27, 22, 36, 0.72));
  border-bottom: 1px solid var(--hairline);
  box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
  z-index: 3;
}

.lounge-badge {
  flex: 0 0 auto;
  width: 96px;
  height: 96px;
  border-radius: 30px;
  display: grid;
  place-items: center;
  font-size: 38px;
  font-weight: 800;
  letter-spacing: 0.06em;
  color: #1a1222;
  background: linear-gradient(148deg, var(--accent), #ff8f4d 58%, var(--violet));
  box-shadow: 0 12px 30px rgba(255, 143, 77, 0.22);
}

.lounge-id { flex: 1 1 auto; min-width: 0; }

.lounge-title {
  margin: 0;
  font-size: var(--fs-title);
  font-weight: 750;
  letter-spacing: -0.015em;
  line-height: 1.1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lounge-sub {
  margin-top: 9px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: var(--fs-sub);
  color: var(--text-dim);
  letter-spacing: 0.01em;
}

.live-dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 0 6px rgba(74, 222, 128, 0.14);
  flex: 0 0 auto;
}

.parody-pill {
  flex: 0 0 auto;
  align-self: flex-start;
  margin-top: 6px;
  padding: 11px 20px;
  border-radius: 999px;
  border: 1px solid var(--card-edge);
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  white-space: nowrap;
}

/* ==========================================================================
   Scroll column + thread
   ========================================================================== */

#scroll {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  overscroll-behavior: contain;
}
#scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }

.thread {
  margin-top: auto;              /* keeps newest content pinned to the bottom */
  padding: 44px 44px 210px;      /* bottom pad clears the watermark scrim */
  display: flex;
  flex-direction: column;
  gap: 34px;
}

/* thread sections: flat containers, collapsed when empty so the
   thread gap never produces phantom space */
#previous,
#reactions {
  display: flex;
  flex-direction: column;
  gap: 34px;
}
#status {
  display: flex;
  justify-content: center;
}
#previous:empty,
#reactions:empty,
#status:empty { display: none; }

/* ==========================================================================
   Message row
   ========================================================================== */

.row {
  display: flex;
  align-items: flex-start;
  gap: 22px;
  max-width: 100%;
}

.row.is-hidden { display: none; }

.row.is-entering {
  opacity: 0;
  transform: translateY(14px);
}

.row {
  transition: opacity 150ms ease-out, transform 150ms ease-out;
}

/* previous Lounge messages — dimmed above the fold */
.row.is-past { opacity: 0.4; filter: saturate(0.72); }

.row-body {
  flex: 1 1 auto;
  min-width: 0;
  max-width: 830px;
}

.row-meta {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin: 0 0 10px 6px;
  min-width: 0;
}

.speaker {
  font-size: var(--fs-name);
  font-weight: 700;
  letter-spacing: -0.005em;
  color: hsl(var(--h, 265) 68% 74%);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex: 0 1 auto;
}

/* understated team / position chip */
.chip {
  flex: 0 0 auto;
  font-family: var(--mono);
  font-size: var(--fs-chip);
  letter-spacing: 0.08em;
  color: var(--text-dim);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  padding: 4px 11px 5px;
  background: rgba(255, 255, 255, 0.026);
  white-space: nowrap;
  text-transform: uppercase;
}

.bubble {
  position: relative;
  background: var(--bubble);
  border: 1px solid var(--bubble-edge);
  border-radius: 30px;
  border-top-left-radius: 10px;   /* asymmetric notch toward the avatar */
  padding: 26px 32px 28px;
  font-size: var(--fs-body);
  line-height: 1.36;
  color: var(--text);
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.24);
  /* long words / 280-char runs must never widen the layout */
  overflow-wrap: anywhere;
  word-break: break-word;
  hyphens: auto;
}

/* the drafted player's own bubble gets a whisper of accent */
.row.is-subject .bubble {
  background: linear-gradient(158deg, #2c2334, #251f31 62%);
  border-color: rgba(255, 182, 72, 0.22);
}

/* ==========================================================================
   Avatar — headshot over a deterministic monogram circle
   ========================================================================== */

.avatar {
  position: relative;
  flex: 0 0 auto;
  width: 98px;
  height: 98px;
  border-radius: 50%;
  overflow: hidden;
  background:
    linear-gradient(152deg,
      hsl(var(--h, 265) 60% 46%),
      hsl(calc(var(--h, 265) + 26) 56% 29%));
  box-shadow:
    inset 0 0 0 2px rgba(255, 255, 255, 0.11),
    0 8px 20px rgba(0, 0, 0, 0.32);
}

.avatar .mono {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 37px;
  font-weight: 700;
  letter-spacing: 0.03em;
  color: #fff;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.28);
  user-select: none;
}

/* Sleeper headshots are transparent cutouts: the gradient shows through,
   so the monogram is hidden whenever a headshot is actually in place. */
.avatar.has-shot .mono { display: none; }

.avatar .shot {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 8%;
  transform: scale(1.16) translateY(4%);
  display: block;
}

/* ==========================================================================
   Draft status card — deliberately NOT a chat bubble
   ========================================================================== */

.status-card {
  align-self: center;
  max-width: 900px;
  margin: 12px 0 6px;
  padding: 30px 46px 34px;
  text-align: center;
  border-radius: 26px;
  background:
    linear-gradient(180deg, rgba(255, 182, 72, 0.09), rgba(255, 182, 72, 0.02)),
    var(--card);
  border: 1px solid var(--card-edge);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.32);
}

.status-eyebrow {
  font-family: var(--mono);
  font-size: var(--fs-eyebrow);
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  overflow-wrap: anywhere;
}

.status-line {
  margin-top: 14px;
  font-size: var(--fs-card);
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.24;
  color: var(--text);
  overflow-wrap: anywhere;
}

.status-line .picked { color: var(--accent); }

.status-rule {
  width: 88px;
  height: 3px;
  margin: 22px auto 0;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--card-edge), transparent);
}

/* ==========================================================================
   Typing indicator
   ========================================================================== */

#typing { align-items: center; }
#typing.is-hidden { display: none; }

.typing-bubble {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 30px 34px;
  background: var(--bubble);
  border: 1px solid var(--bubble-edge);
  border-radius: 30px;
  border-top-left-radius: 10px;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.24);
}

.typing-bubble i {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--text-dim);
  animation: dot 1.25s ease-in-out infinite;
}
.typing-bubble i:nth-child(2) { animation-delay: 0.16s; }
.typing-bubble i:nth-child(3) { animation-delay: 0.32s; }

@keyframes dot {
  0%, 60%, 100% { opacity: 0.32; transform: translateY(0); }
  30%           { opacity: 1;    transform: translateY(-7px); }
}

/* ==========================================================================
   Watermark — subtle, bottom-anchored, above the scroll column
   ========================================================================== */

.watermark {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 172px;
  z-index: 4;
  pointer-events: none;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 40px;
  background: linear-gradient(to top,
    rgba(18, 16, 26, 0.97) 22%,
    rgba(18, 16, 26, 0.72) 58%,
    rgba(18, 16, 26, 0) 100%);
}

.watermark span {
  font-size: var(--fs-mark);
  letter-spacing: 0.16em;
  color: var(--text-faint);
  white-space: nowrap;
}

/* --- browser chrome, not part of the 1080x1920 render target --------------- */
html, body { background: #07080b; margin: 0; }
body { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
       gap: 20px; padding: 24px 12px 40px; box-sizing: border-box; }
#stage { box-shadow: 0 24px 80px rgba(0,0,0,.6); flex: 0 0 auto;
         transform-origin: top center; }
.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  font: 600 15px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: #7b8595; }
.controls button {
  font: inherit; color: #cbd5e1; background: #1a1f27; border: 1px solid #2a3038;
  border-radius: 8px; padding: 9px 16px; cursor: pointer; }
.controls button:hover { background: #232933; }
.controls .meta { color: #4d5666; }
</style>
</head>
<body>

<div class="controls">
  <button id="replay">Replay</button>
  <button id="final">Show final</button>
  <span class="meta" id="meta"></span>
</div>



<div id="stage">

  <header class="lounge-header">
    <div class="lounge-badge" aria-hidden="true">PL</div>
    <div class="lounge-id">
      <h1 class="lounge-title" id="lounge-title">Players Lounge</h1>
      <div class="lounge-sub">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="lounge-sub-text">members · draft night</span>
      </div>
    </div>
    <div class="parody-pill">Parody</div>
  </header>

  <main id="scroll">
    <div class="thread">

      <!-- a) previous Lounge messages, dimmed -->
      <div id="previous"></div>

      <!-- b) centered draft status card -->
      <div id="status"></div>

      <!-- c) the new reaction bubbles -->
      <div id="reactions"></div>

      <!-- typing indicator -->
      <div class="row is-hidden" id="typing">
        <div id="typing-avatar"></div>
        <div class="typing-bubble" aria-label="typing">
          <i></i><i></i><i></i>
        </div>
      </div>

    </div>
  </main>

  <div class="watermark">
    <span id="watermark-text">Players Lounge • Fantasy parody</span>
  </div>

</div>




<script>
/* ==========================================================================
   Players Lounge — browser-side render script
   Plain classic script (NOT an ES module) so it loads over file:// with no
   server, no bundler and no network access. Exposes window.LOUNGE.

   Payload shape:
   {
     pick: { season, pickNo, round?, playerId?, playerName, managerName },
     previousMessages: [ { speakerName, speakerPlayerId, text, headshotUrl?, teamChip? } ],
     reactions:        [ { speakerPlayerId, speakerName, text, delayMs,
                           teamChip?, headshotUrl? } ],
     watermark: string,
     memberCount?: number,      // header subline override
     statusLine?: string        // status card 2nd line override
   }

   API:
     LOUNGE.render(payload)      final state, everything visible, no animation
     LOUNGE.reset(payload)       previous messages + status card only,
                                 every reaction bubble hidden
     LOUNGE.showTyping(speakerPlayerId)
     LOUNGE.hideTyping()
     LOUNGE.revealNext()         -> true if a bubble was revealed, else false
     LOUNGE.messageCount()       -> number of reaction bubbles
     LOUNGE.revealedCount()      -> number currently revealed
     LOUNGE.ready                true once the script has initialised

   Determinism contract for the Playwright driver:
   - Nothing reveals itself. There are no setTimeout/setInterval calls in this
     file. A bubble becomes visible only when revealNext() is called.
   - revealNext() always hides the typing indicator first (a bubble arriving
     is what ends "typing"), then reveals exactly one bubble.
   - The reveal transition is 150ms (see .row in lounge.css). Wait >=200ms
     before capturing a settled frame.
   - Auto-scroll is instant (scrollTop assignment), never smooth.
   ========================================================================== */

(function () {
  'use strict';

  var DEFAULT_WATERMARK = 'Players Lounge • Fantasy parody';

  /* --- deterministic monogram colour ------------------------------------
     FNV-1a 32-bit over the speaker id, indexed into a curated hue ring.
     A curated ring (rather than hash % 360) keeps every avatar inside the
     dark theme's comfortable range - muddy olive/yellow hues are excluded
     because white monogram letters wash out on them. Same id -> same hue,
     forever, with no lookup table to maintain. */
  var HUES = [352, 336, 316, 292, 268, 250, 232, 208, 190, 168, 142, 24];

  function hash32(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }

  function hueFor(id) {
    return HUES[hash32(String(id == null ? '' : id)) % HUES.length];
  }

  function initialsFor(name) {
    var cleaned = String(name == null ? '' : name)
      .replace(/[^A-Za-zÀ-ɏ0-9'\- ]/g, ' ')
      .trim();
    if (!cleaned) return '?';
    var parts = cleaned.split(/\s+/);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    var first = parts[0].charAt(0);
    var last = parts[parts.length - 1].charAt(0);
    return (first + last).toUpperCase();
  }

  /* --- tiny DOM helpers ------------------------------------------------- */

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function $(id) { return document.getElementById(id); }

  function clear(node) {
    while (node && node.firstChild) node.removeChild(node.firstChild);
  }

  /* --- state ------------------------------------------------------------ */

  var state = {
    payload: null,
    rows: [],        // reaction rows, in order
    revealed: 0,
    speakers: {}     // speakerPlayerId -> { name, headshotUrl }
  };

  function nodes() {
    return {
      stage: $('stage'),
      scroll: $('scroll'),
      previous: $('previous'),
      status: $('status'),
      reactions: $('reactions'),
      typing: $('typing'),
      typingAvatar: $('typing-avatar'),
      title: $('lounge-title'),
      sub: $('lounge-sub-text'),
      mark: $('watermark-text')
    };
  }

  /* --- avatar ----------------------------------------------------------- */

  function buildAvatar(speakerId, speakerName, headshotUrl) {
    var hue = hueFor(speakerId);
    var av = el('div', 'avatar');
    av.style.setProperty('--h', String(hue));
    av.appendChild(el('span', 'mono', initialsFor(speakerName)));

    if (headshotUrl) {
      var img = el('img', 'shot');
      img.alt = '';
      img.decoding = 'sync';
      // Hide the monogram up front so a transparent-cutout headshot never
      // shows letters through it; fall back the moment loading fails.
      av.classList.add('has-shot');
      img.addEventListener('error', function () {
        av.classList.remove('has-shot');
        if (img.parentNode) img.parentNode.removeChild(img);
      });
      img.src = headshotUrl;
      av.appendChild(img);
    }
    return { node: av, hue: hue };
  }

  /* --- rows ------------------------------------------------------------- */

  function buildRow(msg, opts) {
    opts = opts || {};
    var row = el('div', 'row');
    if (opts.past) row.classList.add('is-past');
    if (opts.subject) row.classList.add('is-subject');

    var av = buildAvatar(msg.speakerPlayerId, msg.speakerName, msg.headshotUrl);
    row.appendChild(av.node);

    var body = el('div', 'row-body');
    var meta = el('div', 'row-meta');

    var name = el('span', 'speaker', msg.speakerName || 'Unknown');
    name.style.setProperty('--h', String(av.hue));
    meta.appendChild(name);

    var chip = chipText(msg.teamChip);
    if (chip) meta.appendChild(el('span', 'chip', chip));

    body.appendChild(meta);
    body.appendChild(el('div', 'bubble', msg.text || ''));
    row.appendChild(body);
    return row;
  }

  function chipText(chip) {
    if (!chip) return '';
    if (typeof chip === 'string') return chip.trim();
    var bits = [];
    if (chip.team) bits.push(String(chip.team));
    if (chip.position) bits.push(String(chip.position));
    return bits.join(' · ');
  }

  /* --- status card ------------------------------------------------------ */

  function buildStatusCard(pick, statusLine) {
    var p = pick || {};
    var card = el('div', 'status-card');

    var bits = ['DRAFT UPDATE'];
    if (p.round != null) bits.push('Round ' + p.round);
    if (p.pickNo != null) bits.push('Pick ' + p.pickNo);
    card.appendChild(el('div', 'status-eyebrow', bits.join(' · ')));

    var line = el('div', 'status-line');
    if (statusLine) {
      line.textContent = statusLine;
    } else {
      line.appendChild(document.createTextNode(
        (p.managerName || 'A manager') + ' selected '));
      line.appendChild(el('span', 'picked', p.playerName || 'a player'));
    }
    card.appendChild(line);
    card.appendChild(el('div', 'status-rule'));
    return card;
  }

  /* --- scrolling -------------------------------------------------------- */

  function scrollToBottom() {
    var n = nodes();
    if (n.scroll) n.scroll.scrollTop = n.scroll.scrollHeight;
  }

  /* --- population ------------------------------------------------------- */

  function indexSpeakers(payload) {
    var map = {};
    function add(m) {
      if (!m || m.speakerPlayerId == null) return;
      map[String(m.speakerPlayerId)] = {
        name: m.speakerName,
        headshotUrl: m.headshotUrl
      };
    }
    (payload.previousMessages || []).forEach(add);
    (payload.reactions || []).forEach(add);
    return map;
  }

  function populate(payload, hideReactions) {
    payload = payload || {};
    var n = nodes();

    state.payload = payload;
    state.rows = [];
    state.revealed = 0;
    state.speakers = indexSpeakers(payload);

    // header subline
    if (n.sub) {
      var members = payload.memberCount != null
        ? payload.memberCount
        : Object.keys(state.speakers).length;
      n.sub.textContent = members + ' members · draft night';
    }

    // watermark
    if (n.mark) n.mark.textContent = payload.watermark || DEFAULT_WATERMARK;

    // previous Lounge messages, dimmed
    clear(n.previous);
    (payload.previousMessages || []).forEach(function (m) {
      n.previous.appendChild(buildRow(m, { past: true }));
    });

    // draft status card
    clear(n.status);
    n.status.appendChild(buildStatusCard(payload.pick, payload.statusLine));

    // reaction bubbles
    clear(n.reactions);
    var subjectId = payload.pick && payload.pick.playerId != null
      ? String(payload.pick.playerId) : null;
    (payload.reactions || []).forEach(function (m) {
      var row = buildRow(m, {
        subject: subjectId != null && String(m.speakerPlayerId) === subjectId
      });
      if (hideReactions) row.classList.add('is-hidden');
      n.reactions.appendChild(row);
      state.rows.push(row);
    });
    if (!hideReactions) state.revealed = state.rows.length;

    hideTyping();
    scrollToBottom();
  }

  /* --- typing ----------------------------------------------------------- */

  function showTyping(speakerPlayerId) {
    var n = nodes();
    if (!n.typing || !n.typingAvatar) return;
    var info = state.speakers[String(speakerPlayerId)] || {};
    clear(n.typingAvatar);
    var av = buildAvatar(speakerPlayerId, info.name, info.headshotUrl);
    n.typingAvatar.appendChild(av.node);
    n.typing.classList.remove('is-hidden');
    scrollToBottom();
  }

  function hideTyping() {
    var n = nodes();
    if (n.typing) n.typing.classList.add('is-hidden');
  }

  /* --- reveal ----------------------------------------------------------- */

  function revealNext() {
    hideTyping();
    if (state.revealed >= state.rows.length) return false;
    var row = state.rows[state.revealed];
    state.revealed += 1;

    row.classList.add('is-entering');

  var STILL = false;
  var timers = [];

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function showFinal() { clearTimers(); window.LOUNGE.render(PAYLOAD); }

  function play() {
    clearTimers();
    // Fit the 1080x1920 stage to the viewport without touching the render target.
    TIMELINE.events.forEach(function (ev) {
      timers.push(setTimeout(function () {
        var a = ev.action;
        if (a.kind === 'reset') window.LOUNGE.reset(PAYLOAD);
        else if (a.kind === 'showTyping') window.LOUNGE.showTyping(a.speakerPlayerId);

        else if (a.kind === 'reveal') window.LOUNGE.revealNext();
      }, ev.atMs));

  }

  function fit() {
    var stage = document.getElementById('stage');
    if (!stage) return;
    var avail = window.innerHeight - 130;
    var scale = Math.min(1, avail / 1920, (window.innerWidth - 24) / 1080);
    stage.style.transform = 'scale(' + scale + ')';
    stage.style.marginBottom = (1920 * scale - 1920) + 'px';
  }

    if (!window.LOUNGE || !window.LOUNGE.ready) { setTimeout(boot, 20); return; }

    document.getElementById('replay').onclick = play;
    document.getElementById('final').onclick = showFinal;
    fit();
    window.addEventListener('resize', fit);
    if (STILL) showFinal(); else play();
